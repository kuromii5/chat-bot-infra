name: Infrastructure Lint

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.3

      - name: Helm Lint
        run: helm lint .

      - name: Helm Template
        run: helm template chat-bot-app . > /dev/null
