apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: gateway
  name: gateway-configmap
data:
  nginx.conf: |-
    events {
        worker_connections 1024;
    }

    http {
        server_tokens off;

        # Rate limiting zones (per client IP)
        # login: 10 requests/minute — brute force protection
        # register: 5 requests/minute — spam registration protection
        limit_req_zone $binary_remote_addr zone=login_zone:10m    rate=10r/m;
        limit_req_zone $binary_remote_addr zone=register_zone:10m rate=5r/m;

        server {
            listen {{ .Values.gateway.port }};

            # Security headers
            add_header X-Content-Type-Options  "nosniff"    always;
            add_header X-Frame-Options         "DENY"       always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;

            location = /api/v1/auth/login {
                limit_req zone=login_zone burst=3 nodelay;
                limit_req_status 429;

                proxy_pass http://{{ .Values.authService.host }}:{{ .Values.authService.port }};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /api/v1/auth/register {
                limit_req zone=register_zone burst=2 nodelay;
                limit_req_status 429;

                proxy_pass http://{{ .Values.authService.host }}:{{ .Values.authService.port }};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/auth/ {
                proxy_pass http://{{ .Values.authService.host }}:{{ .Values.authService.port }};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/v1/chat/ {
                proxy_pass http://{{ .Values.chatService.host }}:{{ .Values.chatService.port }};

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                location /api/v1/chat/ws {
                    proxy_pass http://{{ .Values.chatService.host }}:{{ .Values.chatService.port }};

                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";

                    proxy_read_timeout 3600s;
                    proxy_send_timeout 3600s;
                }
            }

            location /rabbit/ {
                proxy_pass http://{{ .Values.rabbitmq.host }}:{{ .Values.rabbitmq.managementPort }}/;
                proxy_set_header Host $host;
            }
        }
    }

