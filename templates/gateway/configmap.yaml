apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: gateway
  name: gateway-configmap
data:
  nginx.conf: |-
    server {
        listen {{ .Values.gateway.port }};

        location /api/v1/auth/ {
            proxy_pass http://{{ .Values.authService.host }}:{{ .Values.authService.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/chat/ {
            proxy_pass http://{{ .Values.chatService.host }}:{{ .Values.chatService.port }};

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            location /api/v1/chat/ws {
                proxy_pass http://{{ .Values.chatService.host }}:{{ .Values.chatService.port }};

                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";

                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }
        }

        location /rabbit/ {
            proxy_pass http://{{ .Values.rabbitmq.host }}:{{ .Values.rabbitmq.managementPort }}/;
            proxy_set_header Host $host;
        }
    }

