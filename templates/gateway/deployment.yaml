apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          name: gateway-container
          ports:
            - containerPort: {{ .Values.gateway.port }}
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: gateway-configmap
              readOnly: true
              subPath: nginx.conf
      restartPolicy: Always
      volumes:
        - name: gateway-configmap
          configMap:
            items:
              - key: nginx.conf
                path: nginx.conf
            name: gateway-configmap
