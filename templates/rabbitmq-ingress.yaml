apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-rabbitmq-ingress"
  annotations:
    spec.ingressClassName: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.rabbitmqHost }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.rabbitmq.host }}
            port:
              number: {{ .Values.rabbitmq.managementPort }}
