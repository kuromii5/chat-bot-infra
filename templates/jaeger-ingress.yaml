apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-jaeger-ingress"
  annotations:
    spec.ingressClassName: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.jaegerHost }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jaeger
            port:
              number: 16686