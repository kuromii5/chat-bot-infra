apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.db.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db-container
          image: {{ .Values.db.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.db.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.db.name }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.db.superuser.password }}
            - name: POSTGRES_USER
              value: {{ .Values.db.superuser.user }}
          # livenessProbe:
          #   exec:
          #     command:
          #       - pg_isready -U {{ .Values.db.user }} -d {{ .Values.db.name }}
          #   failureThreshold: 3
          #   periodSeconds: 1
          #   timeoutSeconds: 2
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d/init.sql
              name: db-init-volume
              subPath: init.sql
            - mountPath: /var/lib/postgresql/data
              name: pg-data
      restartPolicy: Always
      volumes:
        - name: db-init-volume
          configMap:
            name: db-init-cm
            items:
              - key: init.sql
                path: init.sql
        - name: pg-data
          persistentVolumeClaim:
            claimName: pg-data
