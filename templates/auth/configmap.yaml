apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.authService.name }}-env"
data:
  DB_HOST: {{ .Values.db.host }}
  DB_NAME: {{ .Values.db.name }}
  DB_PORT: "{{ .Values.db.port }}"
  DB_USER: {{ .Values.db.app.user }}
  DB_SSLMODE: {{ .Values.db.sslmode}}

  JWT_ACCESS_TOKEN_EXPIRY: {{ .Values.authService.jwt.accessTokenExpiry }}
  JWT_REFRESH_TOKEN_EXPIRY: {{ .Values.authService.jwt.refreshTokenExpiry }}

  LOG_LEVEL: {{ .Values.authService.logLevel }}
  SERVER_HOST: {{ .Values.authService.serverHost }}
  SERVER_PORT: "{{ .Values.authService.port }}"
