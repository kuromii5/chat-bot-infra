apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.notificationService.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-db
          image: {{ .Values.db.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ['sh', '-c', "until pg_isready -h {{ .Values.db.host }} -p {{ .Values.db.port }}; do echo waiting for db; sleep 2; done;"]
        - name: wait-for-kafka
          image: busybox:1.36
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ['sh', '-c', "until nc -z {{ .Values.kafka.host }} {{ .Values.kafka.port }}; do echo waiting for kafka; sleep 2; done;"]
      containers:
        - name: notification-container
          image: {{ .Values.notificationService.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.notificationService.metricsPort }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.notificationService.metricsPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: {{ .Values.notificationService.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: "{{ .Values.notificationService.name }}-env"
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-bot-secrets
                  key: db-app-password
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-bot-secrets
                  key: smtp-password
      restartPolicy: Always
