apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-monitoring-ingress"
  annotations:
    spec.ingressClassName: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.monitoringHost }}
    http:
      paths:
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.monitoring.grafana.host }}
            port:
              number: {{ .Values.monitoring.grafana.port }}
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.monitoring.prometheus.host }}
            port:
              number: {{ .Values.monitoring.prometheus.port }}