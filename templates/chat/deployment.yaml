apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.chatService.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-db
          image: {{ .Values.db.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ['sh', '-c', "until pg_isready -h {{ .Values.db.host }} -p {{ .Values.db.port }}; do echo waiting for db; sleep 2; done;"]
      containers:
        - name: chat-container
          image: {{ .Values.chatService.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.chatService.port }}
            - name: metrics
              containerPort: {{ .Values.chatService.metricsPort }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.chatService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: {{ .Values.chatService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: "{{ .Values.chatService.name }}-env"
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-bot-secrets
                  key: db-app-password
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: chat-bot-secrets
                  key: rabbitmq-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-bot-secrets
                  key: jwt-secret
      restartPolicy: Always
